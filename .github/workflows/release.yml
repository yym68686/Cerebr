name: Build and Release Cerebr

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
        paths:
            - '.github/workflows/release.yml'
            - '.github/workflows/publish-stores.yml'
            - 'desktop/**'
            - 'scripts/**'
            - 'package*.json'
            - 'manifest*.json'
            - 'src/**'
            - 'styles/**'
            - 'tests/**'
            - 'htmd'
            - 'vite.config.js'
    workflow_dispatch:
        inputs:
            publish:
                description: Publish a release (automatically version main; other refs use their declared version)
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: cerebr-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
    cancel-in-progress: false

jobs:
    prepare:
        name: Reserve automatic release version
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: write
        outputs:
            sha: ${{ steps.release.outputs.sha }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: Bump versions, reserve tag and fast-forward main
              id: release
              uses: actions/github-script@v7
              with:
                  script: |
                      const { prepareRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/prepare-release.mjs`);
                      await prepareRelease({ github, context, core });

    validate:
        name: Validate and package extensions
        needs: prepare
        if: ${{ !failure() && !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        outputs:
            sha: ${{ needs.prepare.outputs.sha || github.sha }}
            tag: ${{ steps.version.outputs.tag }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.prepare.outputs.sha || github.sha }}
                  submodules: recursive
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - name: Validate release versions
              id: version
              run: node scripts/release-version.mjs
            - run: npm ci
            - run: npm run check
            - run: npm run package:extension
            - uses: actions/upload-artifact@v4
              with:
                  name: release-extensions
                  path: |
                      artifacts/cerebr.zip
                      artifacts/cerebr-firefox.zip
                  if-no-files-found: error
                  retention-days: 14
                  compression-level: 0

    desktop:
        name: Desktop (${{ matrix.platform }}-${{ matrix.arch }})
        needs: validate
        if: ${{ !failure() && !cancelled() }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-15
                      platform: darwin
                      arch: arm64
                    - os: macos-15-intel
                      platform: darwin
                      arch: x64
                    - os: windows-2025
                      platform: win32
                      arch: x64
        runs-on: ${{ matrix.os }}
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.validate.outputs.sha }}
                  submodules: recursive
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm run check --workspace cerebr-desktop
            - name: Make desktop installers
              run: npm run make --workspace cerebr-desktop -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
            - name: Collect installers and checksums
              run: node scripts/collect-desktop-release.mjs ${{ matrix.platform }} ${{ matrix.arch }}
            - uses: actions/upload-artifact@v4
              with:
                  name: release-desktop-${{ matrix.platform }}-${{ matrix.arch }}
                  path: artifacts/release/${{ matrix.platform }}-${{ matrix.arch }}/*
                  if-no-files-found: error
                  retention-days: 14
                  compression-level: 0

    publish:
        name: Publish complete GitHub Release
        needs: [validate, desktop]
        if: ${{ !failure() && !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.validate.outputs.sha }}
                  persist-credentials: false
            - uses: actions/download-artifact@v4
              with:
                  pattern: release-*
                  path: artifacts/release-all
                  merge-multiple: true
            - name: Publish installers only after all platforms succeed
              uses: actions/github-script@v7
              env:
                  RELEASE_TAG: ${{ needs.validate.outputs.tag }}
                  RELEASE_VERSION: ${{ needs.validate.outputs.version }}
                  RELEASE_SHA: ${{ needs.validate.outputs.sha }}
              with:
                  script: |
                      const { publishRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/publish-release.mjs`);
                      await publishRelease({ github, context, core });

    stores:
        name: Submit browser store updates
        needs: [validate, publish]
        if: ${{ !failure() && !cancelled() && needs.publish.result == 'success' }}
        permissions:
            contents: read
            actions: read
        uses: ./.github/workflows/publish-stores.yml
        with:
            tag: ${{ needs.validate.outputs.tag }}
        secrets: inherit
